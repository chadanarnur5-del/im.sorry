<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ты простишь меня?</title>
    <!-- Подключение библиотеки для эффекта конфетти -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #eef2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .card {
            background: white;
            padding: 35px 30px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 400px;
            width: 90%;
            position: relative;
        }

        .img-container {
            width: 180px;
            height: 180px;
            margin: 0 auto 20px auto;
            border-radius: 20px;
            overflow: hidden;
            background-color: #f0f0f0;
        }

        .img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        h1 {
            color: #1c1e21;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 25px;
        }

        .buttons-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            min-height: 50px;
            position: relative;
        }

        button {
            padding: 12px 28px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.15s ease, background-color 0.2s;
        }

        #yesBtn {
            background-color: #3b82f6;
            color: white;
            z-index: 10;
        }

        #yesBtn:hover {
            background-color: #2563eb;
            transform: scale(1.03);
        }

        #noBtn {
            background-color: #e5e7eb;
            color: #374151;
            position: absolute;
        }

        .letter-screen {
            display: none;
        }

        .letter-screen p {
            color: #4b5563;
            line-height: 1.6;
            margin-top: 15px;
            font-size: 16px;
            text-align: left;
        }

        .restart-btn {
            margin-top: 25px;
            background-color: #f3f4f6;
            color: #6b7280;
            font-size: 14px;
            padding: 8px 16px;
        }
    </style>
</head>
<body>

    <div class="card" id="card">
        <!-- Первый шаг: Вопрос -->
        <div id="questionScreen">
            <div class="img-container">
                <img id="mainImage" src="photo.jpg" alt="Мужчина в коробке">
            </div>
            <h1 id="titleText">Ты простишь меня? 🥺</h1>
            <div class="buttons-container" id="btnContainer">
                <button id="yesBtn">Да</button>
                <button id="noBtn">Нет</button>
            </div>
        </div>

        <!-- Второй шаг: Письмо -->
        <div id="letterScreen" class="letter-screen">
            <div class="img-container">
                <img src="photo.jpg" alt="Мужчина в коробке">
            </div>
            <h1>Я знал(а), что ты меня простишь! ❤️</h1>
            <p>Спасибо за твое понимание. Ты очень важена для меня, и я сделаю всё возможное, чтобы больше тебя не расстраивать! ✨</p>
            <button class="restart-btn" onclick="location.reload()">Начать заново</button>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const questionScreen = document.getElementById('questionScreen');
        const letterScreen = document.getElementById('letterScreen');
        const btnContainer = document.getElementById('btnContainer');

        function alignButtons() {
            noBtn.style.left = (yesBtn.offsetLeft + yesBtn.offsetWidth + 15) + 'px';
            noBtn.style.top = yesBtn.offsetTop + 'px';
        }

        window.onload = alignButtons;

        function moveNoButton() {
            const card = document.getElementById('card');
            const cardRect = card.getBoundingClientRect();
            const btnRect = noBtn.getBoundingClientRect();

            const maxX = cardRect.width - btnRect.width - 20;
            const maxY = cardRect.height - btnRect.height - 20;

            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);

            noBtn.style.position = 'absolute';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        noBtn.addEventListener('mouseover', moveNoButton);
        noBtn.addEventListener('click', moveNoButton);

        yesBtn.addEventListener('click', () => {
            questionScreen.style.display = 'none';
            letterScreen.style.display = 'block';

            confetti({
                particleCount: 120,
                spread: 80,
                origin: { y: 0.6 }
            });
        });
    </script>
</body>
</html>
